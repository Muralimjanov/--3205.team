version: "3.8"
services:
  backend:
    build: ./url-backend
    ports:
      - "3000:3000"
    env_file:
      - ./url-backend/.env
    depends_on:
      - db

  frontend:
    build: ./url-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: urlshortener
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
